[package]
name = "signal-curriculum-nexus"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/signal-curriculum-nexus"
description = "Curriculum Nexus Signal contract."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

# ethos/signal.ethos is generated into src/generated/signal.rs by ethos-zero;
# the build script fails when the committed Rust differs from fresh
# generation. The rev string is the one Flow writes, so one ethos-zero source
# stands in every graph that holds both.
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "970459d" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

# The generated contract is committed byte for byte from its ethos source.
[lints.clippy]
large_enum_variant = "allow"
